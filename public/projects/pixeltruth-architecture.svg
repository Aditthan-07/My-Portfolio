<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="16"/>
  <rect width="800" height="450" fill="none" stroke="#1e293b" stroke-width="2" rx="16"/>

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="450"/>
    <line x1="120" y1="0" x2="120" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="280" y1="0" x2="280" y2="450"/>
    <line x1="360" y1="0" x2="360" y2="450"/>
    <line x1="440" y1="0" x2="440" y2="450"/>
    <line x1="520" y1="0" x2="520" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="680" y1="0" x2="680" y2="450"/>
    <line x1="760" y1="0" x2="760" y2="450"/>
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="32" width="230" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="52" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PIXEL TRUTH RESEARCH</text>
  <text x="285" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Dual-Transformer Ensemble Forensic Engine</text>

  <!-- Left: Input Image Block -->
  <g transform="translate(40, 110)">
    <rect width="130" height="230" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="20" width="100" height="100" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <!-- Image placeholder icon -->
    <path d="M30 90 L50 65 L70 85 L85 70 L100 90 Z" fill="#38bdf8" opacity="0.6"/>
    <circle cx="45" cy="50" r="8" fill="#f59e0b" opacity="0.7"/>
    <text x="65" y="145" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">RGB Input</text>
    <text x="65" y="165" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">x ∈ ℝ^{H×W×3}</text>
    <rect x="20" y="185" width="90" height="24" rx="6" fill="#1e293b"/>
    <text x="65" y="201" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Stateless Request</text>
  </g>

  <!-- Branch lines -->
  <path d="M 170 180 C 205 180, 205 150, 240 150" stroke="#06b6d4" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
  <path d="M 170 260 C 205 260, 205 290, 240 290" stroke="#8b5cf6" stroke-width="2" fill="none" stroke-dasharray="4,4"/>

  <!-- Model A: ViT -->
  <g transform="translate(240, 100)">
    <rect width="210" height="96" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="10" y="10" width="8" height="76" rx="4" fill="url(#cyanGrad)"/>
    <text x="28" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Model 1: ViT Backbone</text>
    <text x="28" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">umm-maybe/AI-image-detector</text>
    <text x="28" y="70" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Target: GAN / VQGAN+CLIP</text>
    <rect x="28" y="76" width="110" height="14" rx="4" fill="#083344"/>
    <text x="34" y="87" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Patch-Based Self-Attention</text>
  </g>

  <!-- Model B: Swin -->
  <g transform="translate(240, 244)">
    <rect width="210" height="96" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="10" y="10" width="8" height="76" rx="4" fill="url(#purpleGrad)"/>
    <text x="28" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Model 2: Swin Transformer</text>
    <text x="28" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Organika/sdxl-detector</text>
    <text x="28" y="70" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Target: Stable Diffusion XL</text>
    <rect x="28" y="76" width="125" height="14" rx="4" fill="#2e1065"/>
    <text x="34" y="87" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Shifted Window Hierarchical</text>
  </g>

  <!-- Convergence to Fusion Engine -->
  <path d="M 450 148 C 480 148, 480 200, 500 200" stroke="#06b6d4" stroke-width="2" fill="none"/>
  <path d="M 450 292 C 480 292, 480 240, 500 240" stroke="#8b5cf6" stroke-width="2" fill="none"/>

  <!-- Decision Fusion Engine -->
  <g transform="translate(500, 160)">
    <rect width="130" height="120" rx="12" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="12" y="12" width="106" height="24" rx="6" fill="#1e293b"/>
    <text x="65" y="28" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">FUSION ENGINE</text>
    <text x="65" y="54" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Majority Voting</text>
    <text x="65" y="72" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Confidence Avg</text>
    <text x="65" y="90" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">S_AI vs S_real</text>
    <text x="65" y="104" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Tie-Break Priority</text>
  </g>

  <!-- Output Arrow -->
  <path d="M 630 220 L 660 220" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Output / Explanations -->
  <g transform="translate(660, 130)">
    <rect width="100" height="180" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="15" width="80" height="24" rx="6" fill="#064e3b"/>
    <text x="50" y="31" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">PREDICTION</text>
    <text x="50" y="60" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AI / Real</text>
    <text x="50" y="75" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">94.8% Conf</text>
    
    <!-- Saliency overlay icon -->
    <rect x="15" y="92" width="70" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="50" cy="117" r="14" fill="url(#amberGrad)" opacity="0.8" filter="url(#glow)"/>
    <text x="50" y="156" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Grad-CAM Heatmap</text>
  </g>

  <!-- Bottom Research Note -->
  <text x="40" y="420" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">
    Author: Aditthan J K • Sri Krishna College of Technology (SKCT) • Fig. 1: System Workflow &amp; Architecture
  </text>
</svg>